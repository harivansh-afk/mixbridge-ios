name: artwork-removal-ios
description: Add "Remove Custom Artwork" capability to playlist editor

skill: null

building_spec:
  requirements:
    - Add "Remove Custom Artwork" button to EditPlaylistSheet.swift
    - Show button only when customArtworkData is not nil
    - Button should call updateUserPlaylistArtwork with nil to remove
    - Update UI state to show track artwork when removed
    - Follow existing UI patterns (destructive button style)
  constraints:
    - Must use existing updateUserPlaylistArtwork method
    - Don't modify PlaylistSync.swift (already handles nil)
    - Follow SwiftUI confirmation dialog pattern
    - Show confirmation before removing

verification_spec:
  - type: command
    run: "cd /home/rathiharivansh/hari/mixbridge-ios && swift build 2>&1 | head -20 || xcodebuild -scheme mixbridge -destination 'platform=iOS Simulator,name=iPhone 16' build 2>&1 | tail -30"
    expect: no_error_pattern "error:"

  - type: file-contains
    path: mixbridge/Views/Playlist/EditPlaylistSheet.swift
    pattern: "Remove Custom Artwork"

  - type: file-contains
    path: mixbridge/Views/Playlist/EditPlaylistSheet.swift
    pattern: "customArtworkData != nil"

  - type: agent
    name: ui-flow-check
    prompt: |
      Review EditPlaylistSheet.swift changes:
      1. Button only appears when custom artwork exists
      2. Confirmation dialog before removal
      3. Calls updateUserPlaylistArtwork with nil
      4. UI updates to show track artwork after removal

pr:
  branch: fix/artwork-removal-ui
  base: fix/playlist-custom-image-persistence
  title: "fix(playlist): add remove custom artwork option"