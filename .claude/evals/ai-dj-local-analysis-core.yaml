name: ai-dj-local-analysis-core
description: Local (offline) BPM + beat/downbeat phase analysis for downloaded tracks, with deterministic tests and persistent cache.

building_spec:
  description: |
    Implement the next slice required for “proper AI-DJing” without Convex: local analysis that
    can derive BPM and beat phase/downbeat offset from a downloaded audio file, then cache the
    result locally so transitions can be planned instantly.

    This spec is intentionally constrained to be verifiable and deterministic:
      - The analyzer must be correct on synthetic click tracks and metronome-like signals.
      - For real music, it may return low-confidence/unknown and force fallback behavior.

  requirements:
    - Extend the existing Swift package at Packages/MixBridgeDJ (no new remote dependencies).
    - Add a public analyzer API:
      - `DJLocalAnalyzer.analyze(url: URL, options: DJAnalysisOptions) async throws -> DJAnalysisResult`
      - Result includes at minimum: `bpm`, `beatOffsetSeconds` (phase/downbeat offset), `timeSignature` (optional), `confidence`.
    - Audio decoding:
      - Use AVFoundation to read local files (AVAudioFile) and convert to a stable analysis format (mono Float32).
      - Analyze in windows/frames; do not load entire file into memory for long tracks.
    - BPM detection (deterministic):
      - Provide a deterministic BPM estimator suitable for click tracks (onset/peak interval + autocorrelation or histogram).
      - Return BPM within tolerance for test signals (see tests).
      - Report a confidence score (0..1) based on periodicity/peak sharpness and stability.
    - Beat phase / downbeat offset:
      - Estimate `beatOffsetSeconds` as the time offset from track start to the first “beat zero” reference
        (for click tracks: first pulse; for bar-aware click tracks: first strong downbeat pulse).
      - If bar-sync is enabled and timeSignature is known, prefer aligning to bar boundaries (downbeat).
    - Persistent cache (local DB-like store):
      - Add `DJAnalysisStore` protocol with `get/put/invalidate` keyed by:
        - trackId (string) AND a file identity (e.g., file size + modification date or content hash).
      - Provide a default implementation `DJFileAnalysisStore` that stores Codable JSON records under a directory URL.
      - Ensure cache lookup avoids re-analysis when the same file identity is seen again.
    - Safety + fallback:
      - If confidence < configurable threshold (default 0.6), return a result marked low confidence and
        ensure callers can fall back to non-beat-synced transitions.
    - Integration boundary:
      - Do not integrate into PlaybackCoordinator yet; this is an analysis + cache module only.

  constraints:
    - No network calls; no Convex integration.
    - No third-party DSP libraries.
    - Analyzer must be deterministic and testable (no randomness).
    - Keep analysis off the audio thread; use async/await and background processing.

  files:
    - Packages/MixBridgeDJ/Sources/MixBridgeDJ/DJAnalysisOptions.swift
    - Packages/MixBridgeDJ/Sources/MixBridgeDJ/DJAnalysisResult.swift
    - Packages/MixBridgeDJ/Sources/MixBridgeDJ/DJLocalAnalyzer.swift
    - Packages/MixBridgeDJ/Sources/MixBridgeDJ/DJAnalysisStore.swift
    - Packages/MixBridgeDJ/Sources/MixBridgeDJ/DJFileAnalysisStore.swift
    - Packages/MixBridgeDJ/Tests/MixBridgeDJTests/DJLocalAnalyzerTests.swift
    - Packages/MixBridgeDJ/Tests/MixBridgeDJTests/TestClickTrackFactory.swift

test_output:
  framework: swiftpm
  path: Packages/MixBridgeDJ/Tests/MixBridgeDJTests/

verification_spec:
  # --- Deterministic ---
  - type: command
    run: "swift test --package-path Packages/MixBridgeDJ"
    expect: exit_code 0

  - type: file-exists
    path: Packages/MixBridgeDJ/Sources/MixBridgeDJ/DJLocalAnalyzer.swift

  - type: file-contains
    path: Packages/MixBridgeDJ/Sources/MixBridgeDJ/DJLocalAnalyzer.swift
    pattern: "AVAudioFile"

  - type: file-contains
    path: Packages/MixBridgeDJ/Sources/MixBridgeDJ/DJLocalAnalyzer.swift
    pattern: "Accelerate"

  - type: file-exists
    path: Packages/MixBridgeDJ/Sources/MixBridgeDJ/DJFileAnalysisStore.swift

  - type: file-contains
    path: Packages/MixBridgeDJ/Sources/MixBridgeDJ/DJFileAnalysisStore.swift
    pattern: "JSONEncoder"

  # --- Agent: semantic correctness ---
  - type: agent
    name: bpm-accuracy-on-click-tracks
    prompt: |
      Verify the analyzer is genuinely accurate (not hardcoded):
      1) Review TestClickTrackFactory and DJLocalAnalyzerTests.
      2) Confirm tests generate click tracks at multiple BPMs (at least 3 distinct values).
      3) Confirm analyzer returns BPM within a tight tolerance (<= 0.5 BPM) for those signals.
      4) Confirm beatOffsetSeconds is validated with a small tolerance (<= 0.05s).
    evidence:
      - text: "0.5"
      - text: "0.05"
      - text: "click"
    generate_test: false

  - type: agent
    name: cache-skips-reanalysis
    prompt: |
      Verify cache behavior:
      1) Find tests that run analyze twice with the same file identity.
      2) Confirm the second run hits the DJFileAnalysisStore and does NOT redo heavy analysis work.
         (Use a counter/spy or timestamp evidence in tests.)
      3) Confirm changing file identity forces re-analysis.
    evidence:
      - text: "cache"
      - text: "invalidate" or "identity"
    generate_test: true

  - type: agent
    name: low-confidence-fallback-signal
    prompt: |
      Verify low-confidence handling:
      1) Ensure DJAnalysisResult exposes confidence and a clear “usable for beat sync” boolean or threshold helper.
      2) Ensure analyzer can return low-confidence for non-periodic/noisy input in tests.
      3) Confirm the result is shaped so TransitionPlanner can fall back cleanly.
    evidence:
      - text: "confidence"
      - text: "threshold"
      - text: "fallback"
    generate_test: true
