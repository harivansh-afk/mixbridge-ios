name: posthog-core-events
description: Add playback, search, playlist, and sharing analytics events

skill: null

building_spec:
  requirements:
    - In PlaybackCoordinator.swift:
      - Add track_played event in handleTrackStartedPlaying with track_id, track_title, artist_name, source, duration_seconds
      - Add track_completed event in handleItemDidFinish with track_id, duration_seconds, completion_percent
    - In SearchView.swift:
      - Add search_performed event at end of performSearch with query_length, result_count, source_tab
    - In PlaylistDetailView.swift:
      - Add playlist_opened event on .onAppear with playlist_id, track_count, is_user_created
      - Add playlist_played event when play button tapped with playlist_id, track_count, shuffle (bool)
    - In CreatePlaylistSheet.swift:
      - Add playlist_created event on successful creation with playlist_id, initial_track_count
    - In TrackRow.swift (handleShareTapped):
      - Add content_shared event with content_type="track", content_id, share_method
    - In PlaylistDetailView.swift (share action):
      - Add content_shared event with content_type="playlist", content_id
    - In SharedTrackView.swift and SharedPlaylistView.swift:
      - Add shared_content_viewed event on .onAppear with content_type, content_id
  constraints:
    - Import Analytics where needed
    - Do not capture raw search query text (only query_length for privacy)
    - Use existing property names from models (track.id, playlist.id, etc.)

verification_spec:
  - type: command
    run: "cd /home/rathiharivansh/hari/mixbridge-ios && xcodebuild -scheme mixbridge -destination 'platform=iOS Simulator,name=iPhone 16' build 2>&1 | tail -30"
    expect: no_error_pattern "error:"

  - type: file-contains
    path: mixbridge/Services/PlaybackCoordinator.swift
    pattern: "track_played"

  - type: file-contains
    path: mixbridge/Services/PlaybackCoordinator.swift
    pattern: "track_completed"

  - type: file-contains
    path: mixbridge/Views/Search/SearchView.swift
    pattern: "search_performed"

  - type: file-contains
    path: mixbridge/Views/Playlist/PlaylistDetailView.swift
    pattern: "playlist_opened"

  - type: file-contains
    path: mixbridge/Views/Playlist/CreatePlaylistSheet.swift
    pattern: "playlist_created"

  - type: file-contains
    path: mixbridge/Components/TrackRow.swift
    pattern: "content_shared"

  - type: file-contains
    path: mixbridge/Views/Sharing/SharedTrackView.swift
    pattern: "shared_content_viewed"

pr:
  branch: feat/posthog-core-events
  base: feat/posthog-onboarding
  title: "feat(analytics): add playback, search, playlist, and sharing events"
